  }
  body {

    min-height: 100vh;

  }
  main {
    max-width: 34rem;
    padding: 2.5rem;
    border-radius: 16px;
    background: var(--surface);
  }
  h1 { margin: 0 0 .5rem; font-size: 1.25rem; font-weight: 500; }
  p { margin: 0 0 1rem; color: var(--text-dim); }
  .tag {
    display: inline-block;
    margin-bottom: 1.25rem;
    padding: .25rem .625rem;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font-size: 12px;
  }

<body>
  <main>
    <span class="tag">В разработке</span>
    <h1>Дашборд VOC для PO B2B</h1>

    <p>Текущее состояние — <code>PROGRESS.md</code> в репозитории.</p>
