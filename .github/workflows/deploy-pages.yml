name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install -r tools/requirements.txt

      # Непротиворечивость выгрузки проверяется до публикации: расхождение с
      # ориентирами карточек дешевле поймать здесь, чем в браузере.
      - run: python tools/check_data.py

      - run: python tools/xlsx_to_json.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
